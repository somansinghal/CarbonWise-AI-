<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarbonWise AI | Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { width: 100%; max-width: 440px; padding: 40px; }
        .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 15px; font-weight: 600; padding: 12px 20px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s; flex: 1; }
        .tab-btn.active { color: var(--text-main); border-bottom: 2px solid var(--primary); }
    </style>
</head>
<body>
    <div class="bg-orb"></div>

    <div class="auth-container">
        <div class="glass-panel auth-box animate-fade-up">
            <div class="text-center" style="margin-bottom: 32px;">
                <a href="index.html" class="logo" style="justify-content: center; font-size: 28px; margin-bottom: 12px;">
                    <i class="fa-solid fa-leaf text-gradient"></i> CarbonWise
                </a>
                <p style="font-size: 14px;">Log in to access your sustainability dashboard.</p>
            </div>

            <div style="display: flex; margin-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,0.05);">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log in</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
            </div>

            <button type="button" class="btn-google" onclick="handleGoogleLogin(event)">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>

            <div class="auth-divider">or email</div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="log-email" required placeholder="name@company.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="log-pass" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="form-register" class="hidden" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" required placeholder="jane@company.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-pass" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">Create Account</button>
            </form>

            <div class="text-center" style="margin-top: 24px; font-size: 12px; color: rgba(255,255,255,0.4);">
                By continuing, you agree to our Terms of Service and Privacy Policy.
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/core.js"></script>
    <script>
        Auth.onReady(user => {
            if(user) window.location.href = user.hasBaseline ? 'dashboard.html' : 'onboarding.html';
        });
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('mode') === 'register') switchTab('register');

        function switchTab(tab) {
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-register').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`form-${tab}`).classList.remove('hidden');
        }

        async function handleGoogleLogin(e) {
            e.preventDefault();
            const btn = e.target.closest('.btn-google');
            const originalText = btn.innerHTML;
            btn.innerText = 'Connecting...';
            try {
                await Auth.signInWithGoogle();
                showToast("Google connection successful!");
                // Note: Auth.onReady listener automatically handles the redirect!
            } catch(err) {
                showToast(err.message, 'error');
                btn.innerHTML = originalText;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'Loading...';
            try {
                await Auth.login(document.getElementById('log-email').value, document.getElementById('log-pass').value);
                window.location.href = 'dashboard.html';
            } catch(err) { 
                showToast(err.message, 'error'); 
                btn.innerText = 'Sign In';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'Loading...';
            try {
                await Auth.register(document.getElementById('reg-name').value, document.getElementById('reg-email').value, document.getElementById('reg-pass').value);
                showToast("Account created successfully!");
                setTimeout(() => window.location.href = 'onboarding.html', 1000);
            } catch(err) { 
                showToast(err.message, 'error'); 
                btn.innerText = 'Create Account';
            }
        }
    </script>

</html>
